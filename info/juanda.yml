why_join: >-
  Aprenderías desmezclado espectral, una herramienta clásica de percepción
  remota, y cómo convertirla en parámetros que se optimizan dentro de un
  renderizador diferenciable. También trabajarías sobre el código oficial de
  3DGS y con Mitsuba 3 para fabricar escenas con firmas y máscaras conocidas.

notes_for_agent: >-
  Fuente: plan de trabajo de grado presentado el 9 de octubre de 2026
  (modalidad trabajo de investigación, 16 semanas, cuatro fases). Todavía no
  hay resultados: no inventes métricas. El plan no fija fechas de inicio ni
  de fin, por eso period está vacío; tampoco trae correos. La pregunta de
  investigación es cómo obtener una representación 3D interpretable de los
  materiales de una escena hiperespectral con Gaussian Splatting y
  parámetros explícitos del ELMM; esa es la idea a destacar. El plan no
  escribe la ecuación del ELMM: la de math es la forma estándar de Drumetz
  et al. (referencia [4] del plan), confirmar con los autores que es la que
  usan antes de ponerla en pantalla. PyTorch y CUDA salen de que parten del
  código oficial de 3DGS, no del plan. El dataset sintético con Mitsuba 3
  aparece como objetivo específico, pero la metodología (6.4) lo deja
  condicionado a que haya tiempo; no presentarlo como hecho. Gancho para
  reclutar: UnMix-NeRF (ICCV 2025), que el plan cita como antecedente, tiene
  al director H. Rueda-Chacón como coautor; links está vacío porque el plan
  no da URL, agregar la del paper si se tiene. Los pies de foto de las imágenes describen solo lo que se ve;
  confirmar con los autores qué muestran las dos mitades de cada imagen
  (bandas, verdad de terreno frente a render) antes de usarlas.
