concept: >-
  Una imagen hiperespectral registra la radiancia en muchas bandas estrechas,
  y con ellas la firma espectral de cada material. El proyecto extiende
  3D Gaussian Splatting a imágenes espectrales y guarda en cada gaussiana
  parámetros de desmezclado espectral, para sintetizar vistas nuevas de la
  escena y saber a la vez de qué materiales está hecha.

problem: >-
  3DGS representa la apariencia con tres canales RGB, que no alcanzan para
  separar materiales de color parecido. HyperGS y DD-HGS llevan 3DGS al
  dominio hiperespectral, pero codifican el espectro con redes MLP de caja
  negra. SpectralGaussians modela la iluminación por banda y necesita SAM
  para segmentar. Ninguno usa la firma espectral para identificar de forma
  nativa los componentes puros de la escena (endmembers). A esto se suma que
  hay pocos conjuntos de datos multivista con información espectral.

approach: >-
  Cada gaussiana guarda parámetros explícitos del Extended Linear Mixing
  Model (ELMM) en lugar de un color: abundancias sobre un conjunto de firmas
  de referencia. La implementación parte del código oficial de 3DGS, que se
  modifica para procesar imágenes espectrales y estimar esas firmas y
  abundancias durante la optimización. Se evalúa contra 3DGS, HyperGS,
  SpectralGaussians y UnMix-NeRF con métricas de imagen (PSNR, SSIM, LPIPS)
  y de fidelidad espectral (SAM, RMSE).

