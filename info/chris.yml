why_join: >-
  Trabajarías con radiometría de verdad (Planck, emisividad, atenuación del
  aire) y la meterías dentro de un método de rasterización diferenciable que
  se entrena por gradiente. Es una buena puerta de entrada al infrarrojo y a
  los modelos de renderizado guiados por la física.

notes_for_agent: >-
  Fuente: plan de trabajo de grado presentado el 10 de octubre de 2026
  (modalidad trabajo de investigación, 16 semanas, cinco fases). Todavía no
  hay resultados: no inventes métricas ni comparaciones. El plan no fija
  fechas de inicio ni de fin, por eso period está vacío; confirmarlo con los
  autores. Tampoco trae correos. Elegí line "neural" porque la base es 3DGS;
  el modelo de atenuación (Beer-Lambert) toca la línea volumétrica, cambiarlo
  a otra si el director lo ubica distinto. La ecuación de Planck del plan
  incluye un factor 2 \times 10^{-4} de conversión de unidades; aquí va la
  forma estándar. Lo que conviene destacar en la diapositiva es la pregunta
  de investigación: cómo meter el modelo físico de propagación de radiación
  LWIR (emisión, reflexión, medio) dentro de 3DGS. Los pies de foto de las
  imágenes salen de lo que se ve en ellas (ejes y títulos de la gráfica);
  confirmar con los autores que son datos del proyecto y de qué base de
  datos vienen.
