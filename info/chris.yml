concept: >-
  En el infrarrojo de onda larga (LWIR), lo que llega a la cámara es la
  radiación que emite cada superficie por su temperatura, más la que refleja
  del entorno y la que aporta el aire en el camino. El proyecto adapta
  3D Gaussian Splatting para sintetizar vistas nuevas de escenas en LWIR a
  partir de pocas imágenes hiperespectrales, con ese modelo físico dentro de
  la optimización.

problem: >-
  NeRF y 3DGS se diseñaron para imágenes RGB. ThermoNeRF y ThermalGaussian
  llevan la síntesis de vistas al térmico, pero interpolan la radiancia medida
  como si fuera color. Thermal3D-GS añade restricciones físicas, aunque no
  separa la emisión propia, la reflexión del entorno y el aporte del medio.
  En LWIR esa separación importa: un vidrio transparente en el visible es
  opaco en el térmico, y la intensidad medida depende de la temperatura y de
  la emisividad de cada material.

approach: >-
  Primero se modela la formación de la imagen LWIR con las leyes de Planck,
  Kirchhoff y Beer-Lambert, teniendo en cuenta la posición de la cámara, el
  ángulo de visión, la reflexión y la atenuación atmosférica. Ese modelo pasa
  a las propiedades de cada gaussiana y a la función de pérdida, así la
  optimización queda restringida por emisión, reflexión y atenuación. El
  algoritmo se implementa en Python y se compara con ThermoNeRF y
  ThermalGaussian usando PSNR, SSIM y LPIPS sobre vistas no vistas en el
  entrenamiento.

